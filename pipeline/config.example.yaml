# Copy to config.yaml and edit. The adapter runs `omp models --json` at runtime,
# resolves these hints to installed IDs, and refuses provider hopping.

omp:
  binary: omp
  session_root: ./data/sessions
  workspace_root: ./data/workspaces
  timeout_sec: 900
  kill_grace_sec: 8
  max_retries: 3
  retry_base_sec: 2.0
  retry_max_sec: 60.0
  json_mode: true
  persist_sessions: true
  # OMP v17 calls this --auto-approve; the adapter emits it only when probed.
  approve: true
  # Keep web/search/browser tools available, but optionally exclude local mutation tools.
  no_tools: false
  exclude_tools: []
  no_context_files: true
  thinking: max
  use_goal_slash: true
  no_pty: true
  no_extensions: false
  no_skills: false
  no_rules: false
  require_catalog: true

models:
  # Gemini MUST come from Antigravity. GPT MUST come from Codex.
  discovery: google-antigravity/gemini-3.7-flash
  coordinator: google-antigravity/gemini-3.7-flash
  analyst: openai-codex/gpt-5.6-sol
  verifier: openai-codex/gpt-5.6-luna
  gemini_provider: google-antigravity
  gpt_provider: openai-codex
  allow_fallback: false

concurrency:
  max_parallel_agents: 8
  discovery_agents: 20
  smoke_discovery_agents: 3
  min_luna_agents: 2
  max_luna_agents: 20
  luna_tasks_per_agent: 4

research:
  country: Egypt
  language_hint: "Arabic and English public sources"
  scope_hint: "Research broadly within the assigned scope."
  categories:
    - technology
    - gaming
    - consoles
    - pc_hardware
    - laptops
    - mobile_phones
    - gaming_accessories
    - components
    - used_hardware
    - repair
    - electronics
    - online_electronics
  max_discovery_rounds: 8
  max_verification_rounds: 6
  analysis_batch_size: 24
  stale_after_days: 730
  max_verification_tasks_per_merchant: 6
  max_verification_tasks_total: 100
  max_task_attempts: 3
  diminishing_ratio: 0.15
  diminishing_streak: 2

quality_gates:
  min_unique_merchants: 80
  min_identity_resolution_rate: 0.45
  min_multi_source_merchant_ratio: 0.30
  min_positive_evidence_ratio: 0.20
  min_negative_evidence_ratio: 0.10
  min_neutral_evidence_ratio: 0.05
  min_high_or_medium_confidence_ratio: 0.40
  max_duplicate_rate: 0.45
  max_stale_evidence_ratio: 0.50
  min_cities: 4
  min_categories: 6
  min_source_platforms: 4

database:
  path: ./data/merchant_intelligence.db
logging:
  dir: ./logs
  level: INFO
export:
  dir: ./data/export

